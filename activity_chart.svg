<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .bg-card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 16px; filter: url(#shadow); }
    .grid-line { stroke: #1e293b; stroke-dasharray: 4,4; stroke-width: 1; }
    .label { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #64748b; font-weight: 600; text-anchor: middle; }
    .chart-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 15px; fill: #f8fafc; font-weight: 700; }
    .chart-subtitle { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; fill: #94a3b8; }
    .stat-val { font-family: 'Segoe UI', Ubuntu, sans-serif; font-size: 16px; font-weight: 800; fill: #38bdf8; }
    .point { fill: #0f172a; stroke: #38bdf8; stroke-width: 3; }
  </style>

  <!-- Background -->
  <rect width="850" height="260" class="bg-card" />

  <!-- Header -->
  <text x="30" y="38" class="chart-title">📈 Career Contribution &amp; Activity Velocity</text>
  <text x="30" y="55" class="chart-subtitle">Progressive Software Architecture &amp; Full-Stack Progression (2021 — 2026)</text>
  
  <text x="730" y="38" class="label" style="text-anchor: end;">Total Volume</text>
  <text x="730" y="57" class="stat-val" style="text-anchor: end;">3,931 Commits • 135 PRs</text>

  <!-- Horizontal Grid Lines -->
  <line x1="60" y1="90" x2="790" y2="90" class="grid-line" />
  <line x1="60" y1="130" x2="790" y2="130" class="grid-line" />
  <line x1="60" y1="170" x2="790" y2="170" class="grid-line" />
  <line x1="60" y1="210" x2="790" y2="210" class="grid-line" />

  <!-- Grid Y-Labels -->
  <text x="45" y="94" class="label" style="text-anchor: end;">1.5k</text>
  <text x="45" y="134" class="label" style="text-anchor: end;">1.0k</text>
  <text x="45" y="174" class="label" style="text-anchor: end;">500</text>
  <text x="45" y="214" class="label" style="text-anchor: end;">0</text>

  <!-- Chart Curve & Fill -->
  <!-- Coordinates: 2021(110, 195), 2022(230, 180), 2023(360, 160), 2024(490, 125), 2025(620, 95), 2026(740, 85) -->
  <path d="M 110 195 C 170 190, 190 183, 230 180 C 290 175, 310 165, 360 160 C 420 152, 440 132, 490 125 C 550 115, 570 100, 620 95 C 670 90, 700 86, 740 85 L 740 210 L 110 210 Z" fill="url(#areaGrad)" />
  <path d="M 110 195 C 170 190, 190 183, 230 180 C 290 175, 310 165, 360 160 C 420 152, 440 132, 490 125 C 550 115, 570 100, 620 95 C 670 90, 700 86, 740 85" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Points & Nodes -->
  <circle cx="110" cy="195" r="5" class="point" />
  <circle cx="230" cy="180" r="5" class="point" />
  <circle cx="360" cy="160" r="5" class="point" />
  <circle cx="490" cy="125" r="5" class="point" />
  <circle cx="620" cy="95" r="5" class="point" />
  <circle cx="740" cy="85" r="6" class="point" stroke="#34d399" />

  <!-- Bottom Year Labels -->
  <text x="110" y="235" class="label">2021</text>
  <text x="230" y="235" class="label">2022</text>
  <text x="360" y="235" class="label">2023</text>
  <text x="490" y="235" class="label">2024</text>
  <text x="620" y="235" class="label">2025</text>
  <text x="740" y="235" class="label" fill="#38bdf8" font-weight="700">2026 (Current)</text>
</svg>